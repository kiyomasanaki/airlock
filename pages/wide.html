<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="wTitle">Airlock · Wide view</title>
<script src="../js/theme.js"></script>
<script src="../js/state.js"></script>
<script src="../js/i18n.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/popup.css">
<link rel="stylesheet" href="../css/wide.css">
</head>
<!-- Same ids as pages/popup.html: js/popup.js drives both, data-view="wide"
     turns off what only makes sense in the popup (ten-idea cap, 600 px limit). -->
<body data-view="wide">

<div class="wide">
  <div class="topbar">
    <div class="brand"><img src="../icons/icon32.png" alt="">Airlock</div>
    <div class="topbar-btns">
    <button class="theme-toggle lang-toggle" id="btnLang" aria-expanded="false" aria-controls="langPanel">
      <img class="flag" id="langFlag" src="../icons/flags/gb.svg" alt="">
    </button>
    <button class="theme-toggle" id="btnTheme" title="light / dark theme" aria-label="toggle theme" data-i18n-title="themeToggleTitle" data-i18n-aria-label="themeToggleAria">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
    </div>
  </div>

  <!-- language picker: unfolds in the flow, under the top bar -->
  <section class="lang-panel" id="langPanel" hidden aria-labelledby="langPanelTitle">
    <div class="section-title" id="langPanelTitle" data-i18n="langPanelTitle">Interface language</div>
    <div class="lang-grid" id="langGrid" role="group" aria-labelledby="langPanelTitle"></div>
  </section>

  <div class="wide-grid">
    <div class="wide-side">
      <div class="focus-bar card">
        <div class="focus-main">
          <div class="focus-label"><span class="dot idle" id="dot"></span><span data-i18n="currentFocus">current focus</span></div>
          <div class="focus-text empty" id="focusText"></div>
          <div class="next-step" id="nextStep" hidden></div>
        </div>
        <button class="btn-x" id="btnDone" title="done" aria-label="mark the focus as done" data-i18n-title="doneTitle" data-i18n-aria-label="doneAria">✓</button>
      </div>

      <div class="capture-row">
        <input type="text" id="input" placeholder="capture the impulse..." autofocus maxlength="500" aria-label="capture an impulse" data-i18n-placeholder="capturePlaceholder" data-i18n-aria-label="captureAria" />
        <button class="btn-capture" id="btnAdd" title="capture" aria-label="capture" data-i18n-title="captureBtn" data-i18n-aria-label="captureBtn">+</button>
      </div>
      <div class="hint" id="hint"></div>

      <div class="decision card" id="decision" role="group" aria-labelledby="decisionQ">
        <div class="decision-q" id="decisionQ"></div>
        <div class="decision-btns">
          <button class="btn-d switch" id="btnGo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
            <span data-i18n="btnSwitch">switch</span>
            <span class="key" aria-hidden="true">1</span>
          </button>
          <button class="btn-d queue" id="btnQueue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span data-i18n="btnQueue">queue</span>
            <span class="key" aria-hidden="true">2</span>
          </button>
          <button class="btn-d drop" id="btnDrop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            <span data-i18n="btnDrop">drop</span>
            <span class="key" aria-hidden="true">3</span>
          </button>
        </div>
      </div>

      <!-- focus guard: replaces the decision while it asks (js/guard.js) -->
      <div class="guard card" id="guard" hidden role="group" aria-labelledby="guardQ" aria-live="polite">
        <div class="decision-q" id="guardQ"></div>
        <div class="decision-btns" id="guardAsk">
          <button class="btn-d yes" id="guardYes"><span data-i18n="guardYes">yes, done</span><span class="key" aria-hidden="true">1</span></button>
          <button class="btn-d drop" id="guardNo"><span data-i18n="guardNo">not yet</span><span class="key" aria-hidden="true">2</span></button>
        </div>
        <div class="decision-btns" id="guardInsist" hidden>
          <button class="btn-d queue" id="guardQueue"><span id="guardQueueLabel"></span><span class="key" aria-hidden="true">2</span></button>
          <button class="btn-d drop" id="guardDrop"><span data-i18n="btnDrop">drop</span><span class="key" aria-hidden="true">3</span></button>
          <button class="guard-anyway" id="guardAnyway" data-i18n="guardAnyway">switch anyway</button>
        </div>
        <div class="hint" id="guardHint"></div>
      </div>

      <div id="doneSection" style="display:none">
        <div class="section-title" data-i18n="doneToday">done today</div>
        <div id="done"></div>
      </div>

      <div class="footer">
        <span id="count"></span>
        <span>
          <button id="btnMethod" title="break the focus into small concrete steps" data-i18n="methodBtn" data-i18n-title="methodTitle">steps</button>
          <span class="sep wide-only-hide"> · </span>
          <button id="btnWide" class="wide-only-hide" data-i18n="wideBtn" data-i18n-title="wideBtnTitle">wide view</button>
          <span class="sep"> · </span>
          <button id="btnAbout" data-i18n="aboutBtn">credits</button>
          <span class="sep"> · </span>
          <button id="btnReset" data-i18n="resetBtn">clear all</button>
        </span>
      </div>
    </div>

    <div class="wide-main">
      <div class="section-title" data-i18n="queueTitle">priority queue</div>
      <div id="queue"></div>
      <button class="queue-more" id="queueMore" hidden></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="btnUndo" data-i18n="undo">undo</button>
  </div>
</div>

<script src="../js/guard.js"></script>
<script src="../js/popup.js"></script>
</body>
</html>
