<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Airlock</title>
<script src="../js/theme.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #eef0f5;
  --surface: #f4f6fa;
  --surface-2: #ffffff;
  --border: #dde1ea;
  --text: #1e2938;
  --text-dim: #5b6472;
  --text-faint: #9aa2b1;
  --shadow-light: rgba(255, 255, 255, 0.85);
  --shadow-dark: rgba(163, 177, 198, 0.45);
  --accent: #14b8a6;
  --switch: #0f9c8f;
  --switch-text: #ffffff;
  --queue: #f2b53c;
  --queue-text: #4a3300;
  --drop: #f0645f;
  --drop-text: #ffffff;
  --success: #22c55e;
}

:root[data-theme="dark"] {
  --bg: #15171b;
  --surface: #1b1d22;
  --surface-2: #202329;
  --border: #2a2d34;
  --text: #e8e9ec;
  --text-dim: #9198a3;
  --text-faint: #565c68;
  --shadow-light: rgba(255, 255, 255, 0.04);
  --shadow-dark: rgba(0, 0, 0, 0.55);
  --accent: #2dd4bf;
  --switch: #0d9488;
  --switch-text: #eafffb;
  --queue: #d99b2b;
  --queue-text: #2a1c00;
  --drop: #e0554f;
  --drop-text: #fff0ef;
  --success: #34d399;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  width: 380px;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  font-size: 14px;
}

.topbar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 10px; }
.theme-toggle {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.theme-toggle:hover { color: var(--text); }
.theme-toggle svg { width: 15px; height: 15px; }
.theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }

.focus-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  padding: 12px 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.dot.idle { background: var(--text-faint); }
.focus-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
.focus-text { font-size: 14px; font-weight: 500; flex: 1; word-break: break-word; color: var(--text); }
.focus-text.empty { font-weight: 400; color: var(--text-faint); font-style: italic; }

.capture-row { display: flex; gap: 8px; margin-bottom: 8px; }
#input {
  flex: 1;
  font-size: 14px;
  padding: 11px 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  color: var(--text);
  outline: none;
  font-family: inherit;
}
#input::placeholder { color: var(--text-faint); }
#input:focus { border-color: var(--accent); }

.btn-capture {
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  flex-shrink: 0;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
}
.btn-capture:active { opacity: 0.8; }

.hint { font-size: 11px; color: var(--text-faint); margin-bottom: 16px; }

.section-title {
  font-size: 10px; font-weight: 600; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin: 16px 0 8px;
}

.decision {
  border-radius: 16px;
  margin-bottom: 14px;
  display: none;
}
.decision.visible { display: block; }
.decision-q { font-size: 13px; margin-bottom: 10px; line-height: 1.4; color: var(--text); }
.decision-q b { font-weight: 600; color: var(--queue); }
.decision-q .sub { color: var(--text-dim); font-size: 12px; }
.decision-btns { display: flex; flex-direction: column; gap: 8px; }

.btn-d {
  display: flex; align-items: center; gap: 10px;
  border: none;
  border-radius: 999px;
  padding: 11px 18px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
}
.btn-d svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-d:active { transform: translateY(1px); }
.btn-d.switch { background: var(--switch); color: var(--switch-text); }
.btn-d.queue { background: var(--queue); color: var(--queue-text); }
.btn-d.drop { background: var(--drop); color: var(--drop-text); }

.queue-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 11px;
  margin-bottom: 6px;
}
.queue-item.top { border-color: var(--queue); }
.qnum { font-size: 11px; color: var(--text-faint); min-width: 14px; font-weight: 500; }
.qtext { flex: 1; font-size: 13px; word-break: break-word; color: var(--text-dim); }
.qbtns { display: flex; gap: 4px; }
.btn-x {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 24px; height: 24px;
  cursor: pointer; padding: 0;
  font-size: 12px; line-height: 1; color: var(--text-faint);
  display: flex; align-items: center; justify-content: center;
}
.btn-x:hover { color: var(--text); }
.btn-x.danger:hover { color: var(--drop); border-color: var(--drop); }
.btn-x.go { color: var(--queue); border-color: var(--queue); }

.empty { color: var(--text-faint); font-style: italic; font-size: 12px; padding: 4px 0; }

.footer {
  margin-top: 16px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 10px; color: var(--text-faint);
  display: flex; justify-content: space-between;
  align-items: center;
}
.footer button {
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: 10px; padding: 0;
  text-decoration: underline;
}
.footer button:hover { color: var(--text); }

.done-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 0;
  font-size: 12px; color: var(--text-faint);
}
.done-item .check { color: var(--success); font-weight: bold; }

.next-step {
  margin-top: 4px;
  font-size: 12px; color: var(--text-dim); line-height: 1.35;
  word-break: break-word;
}
.next-step b { color: var(--accent); font-weight: 600; }

.btn-d .key {
  margin-left: auto;
  min-width: 20px; padding: 1px 6px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.14);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px; text-align: center;
}
.btn-d:focus-visible, .btn-x:focus-visible, .btn-capture:focus-visible, .theme-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.toast {
  display: none;
  align-items: center; gap: 10px;
  margin-top: 12px; padding: 9px 12px;
  border-radius: 12px;
  background: var(--text); color: var(--bg);
  font-size: 12px;
}
.toast.visible { display: flex; }
.toast span { flex: 1; word-break: break-word; }
.toast button {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font: inherit; font-weight: 700;
  text-decoration: underline; padding: 0;
}

@media (prefers-reduced-motion: reduce) {
  .btn-d:active { transform: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <button class="theme-toggle" id="btnTheme" title="theme clair / sombre" aria-label="basculer le theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
  </button>
</div>

<div class="focus-bar">
  <div class="dot idle" id="dot"></div>
  <div style="flex:1; min-width:0">
    <div class="focus-label">focus actuel</div>
    <div class="focus-text empty" id="focusText">aucun — tape ci-dessous</div>
    <div class="next-step" id="nextStep" hidden></div>
  </div>
  <button class="btn-x" id="btnDone" title="terminé — le suivant de la file prend la place" aria-label="marquer le focus comme terminé">✓</button>
</div>

<div class="capture-row">
  <input type="text" id="input" placeholder="capture l'impulsion..." autofocus maxlength="500" aria-label="capturer une impulsion" />
  <button class="btn-capture" id="btnAdd" title="capturer" aria-label="capturer">+</button>
</div>
<div class="hint" id="hint">Entrée pour valider · Ctrl+Shift+Q pour rouvrir</div>

<div class="decision" id="decision" role="group" aria-labelledby="decisionQ">
  <div class="decision-q" id="decisionQ"></div>
  <div class="decision-btns">
    <button class="btn-d switch" id="btnGo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
      je switch
      <span class="key" aria-hidden="true">1</span>
    </button>
    <button class="btn-d queue" id="btnQueue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      file d'attente
      <span class="key" aria-hidden="true">2</span>
    </button>
    <button class="btn-d drop" id="btnDrop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      laisser tomber
      <span class="key" aria-hidden="true">3</span>
    </button>
  </div>
</div>

<div class="section-title">file de priorités</div>
<div id="queue"><div class="empty">vide — bonne concentration</div></div>

<div id="doneSection" style="display:none">
  <div class="section-title">fait aujourd'hui</div>
  <div id="done"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button id="btnUndo">annuler</button>
</div>

<div class="footer">
  <span id="count">0 en file</span>
  <span>
    <button id="btnMethod" title="découper le focus en petites étapes concrètes">découper en étapes</button>
    <span style="color:var(--border)"> · </span>
    <button id="btnReset">tout vider</button>
  </span>
</div>

<script src="../js/state.js"></script>
<script src="../js/popup.js"></script>
</body>
</html>
